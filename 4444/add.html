<!DOCTYPE html>
<html lang="tg">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>marken.tj - Подать объявление</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7f9;
    color:#222;
}

/* HEADER */

header{
    height:80px;
    background:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 40px;

    border-bottom:1px solid #ddd;
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#078aca;
}

.back{
    text-decoration:none;
    background:#f45112;
    color:white;

    padding:12px 22px;

    border-radius:8px;

    font-weight:bold;
}

/* MAIN */

.container{
    width:90%;
    max-width:850px;

    margin:35px auto;
}

.form-box{
    background:white;

    padding:30px;

    border-radius:15px;

    box-shadow:0 4px 20px rgba(0,0,0,.12);
}

h1{
    text-align:center;
    margin-bottom:30px;
}

/* LABEL */

label{
    display:block;

    font-weight:bold;

    margin-bottom:8px;
}

/* INPUT */

input,
select,
textarea{

    width:100%;

    padding:14px;

    margin-bottom:18px;

    border:1px solid #d5d5d5;

    border-radius:9px;

    font-size:16px;

    outline:none;
}

input:focus,
select:focus,
textarea:focus{

    border-color:#078aca;
}

textarea{
    height:120px;
    resize:none;
}

/* TWO COLUMNS */

.row{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:15px;
}

/* CATEGORY */

.category-info{

    background:#f5fbff;

    border:1px solid #bde7fa;

    border-radius:12px;

    padding:20px;

    margin-bottom:20px;
}

.category-title{

    color:#078aca;

    font-size:20px;

    font-weight:bold;

    margin-bottom:18px;
}

/* PHOTO */

.photo-box{

    border:2px dashed #078aca;

    border-radius:12px;

    padding:30px;

    text-align:center;

    margin-bottom:25px;

    background:#f8fcff;
}

.photo-button{

    display:inline-block;

    background:#078aca;

    color:white;

    padding:14px 25px;

    border-radius:8px;

    cursor:pointer;

    font-weight:bold;
}

#photos{
    display:none;
}

#photoCount{

    margin-top:15px;

    font-weight:bold;

    color:#555;
}

/* PHOTO PREVIEWS */

#previewContainer{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:10px;

    margin-top:20px;
}

.photo-preview{

    width:100%;

    height:150px;

    object-fit:cover;

    border-radius:10px;

    border:1px solid #ddd;
}

/* PUBLISH */

.publish{

    width:100%;

    padding:16px;

    border:none;

    border-radius:9px;

    background:#f45112;

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;
}

.publish:hover{

    background:#d93e08;
}

/* MOBILE */

@media(max-width:600px){

    header{
        padding:0 15px;
    }

    .row{
        grid-template-columns:1fr;
        gap:0;
    }

    .form-box{
        padding:20px;
    }

    #previewContainer{

        grid-template-columns:
        repeat(2,1fr);

    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">
        marken.tj
    </div>

    <a
        href="index.html"
        class="back"
    >
        ← Бозгашт
    </a>

</header>


<!-- MAIN -->

<div class="container">

<div class="form-box">


<h1>
    📢 Подать объявление
</h1>


<!-- CATEGORY -->

<label>
    Категория
</label>

<select
    id="category"
    onchange="showFields()"
>

    <option value="">
        Категорияро интихоб кунед
    </option>

    <option value="car">
        🚗 Мошин
    </option>

    <option value="phone">
        📱 Телефон
    </option>

    <option value="house">
        🏠 Хона
    </option>

    <option value="computer">
        💻 Компютер
    </option>

    <option value="electronics">
        📺 Электроника
    </option>

    <option value="furniture">
        🛋️ Мебел
    </option>

    <option value="clothes">
        👕 Либос
    </option>

    <option value="other">
        📦 Дигар
    </option>

</select>


<!-- CATEGORY FIELDS -->

<div id="categoryFields"></div>


<!-- NAME -->

<label id="nameLabel">
    Номи маҳсулот
</label>

<input
    id="name"
    type="text"
    placeholder="Номи маҳсулотро нависед"
>


<!-- PRICE + CITY -->

<div class="row">

    <div>

        <label>
            Нарх
        </label>

        <input
            id="price"
            type="number"
            placeholder="Масалан: 800"
        >

    </div>


    <div>

        <label>
            Шаҳр
        </label>

        <input
            id="city"
            type="text"
            placeholder="Масалан: Душанбе"
        >

    </div>

</div>


<!-- PHONE -->

<label>
    Рақами телефон
</label>

<input
    id="phone"
    type="tel"
    placeholder="+992 900000000"
>


<!-- DESCRIPTION -->

<label>
    Маълумоти иловагӣ
</label>

<textarea
    id="description"
    placeholder="Маълумоти бештар дар бораи маҳсулот..."
></textarea>


<!-- PHOTOS -->

<label>
    Аксҳои маҳсулот
</label>

<div class="photo-box">

    <label
        for="photos"
        class="photo-button"
    >
        📷 Выберите фотографии
    </label>

    <input
        id="photos"
        type="file"
        accept="image/*"
        multiple
    >

    <p id="photoCount">
        Акс интихоб нашудааст
    </p>

    <div id="previewContainer"></div>

</div>


<!-- PUBLISH -->

<button
    class="publish"
    onclick="publishAd()"
>
    📢 Эълонро нашр кардан
</button>


</div>

</div>


<script>


/* =================================

================================= */

        Қуттии суръат

        Интихоб кунед
        </option>

        <option>
        Механика
        </option>

        <option>
        Автомат
        </option>

        <option>
        Робот
        </option>

        <option>

        </label>

        >

    /* ТЕЛЕФОН */

    else if(category === "phone"){

        nameLabel.innerText =
        "Номи телефон";

        "Масалан: iPhone 15 Pro";


        box.innerHTML = `

        <div class="category-info">

        📱 Маълумоти телефон
        </div>

        </label>

        >

        Хотира
        </label>

        <input
        id="memory"

        >

        </div>


        <div>

        <label>

        </label>

        <input

        >

        </div>

        </div>

        </label>

        <input
        id="color"
        placeholder="Сиёҳ, сафед..."
        >

        </label>

        <select id="condition">

        <option>
        Нав
        </option>

        <option>

        </option>

    /* ХОНА */

        nameLabel.innerText =

        nameInput.placeholder =
        "Масалан: Хонаи 3-ҳуҷрагӣ";


        box.innerHTML = `

        <div class="category-info">

        <div class="category-title">
        🏠 Маълумоти хона
        </div>


        <div class="row">

        <div>

        </label>

        </label>

        <input

        </div>


        <label>

        </label>

        <input
        id="floor"

        </label>

        <input

        placeholder="Душанбе, марказ..."

        Ҳолати хона
        </label>

        <select id="condition">

        <option>
        Нав
        </option>

        <option>
        Таъмиршуда
        </option>

        <option>
        Таъмирталаб
        </option>

        nameLabel.innerText =

        nameInput.placeholder =

        box.innerHTML = `

        <div class="category-info">

        <div class="category-title">
        💻 Маълумоти компютер
        </div>


        <label>
        Бренд
        </label>

        <input

    /* ЛИБОС */

        nameInput.placeholder =
        "Масалан: Куртаи мардона";


        box.innerHTML = `

        <div class="category-info">

        👕 Маълумоти либос
        </div>

        Андоза
        </label>

        <input
        id="size"
        placeholder="S, M, L, XL"
        >


        <label>
        Ранг
        </label>

        <input
        id="color"
        placeholder="Сиёҳ, сафед..."
        >

/* =================================
   SELECT MULTIPLE PHOTOS
================================= */

document
.getElementById("photos")
.addEventListener(
    "change",
    function(){

        let files =
        this.files;


        /* MAXIMUM 10 */

        if(files.length > 10){

            alert(
                "⚠️ Максимум 10 акс интихоб кардан мумкин аст!"
            );

            this.value = "";

            document.getElementById(
                "photoCount"
            ).innerText =
            "Акс интихоб нашудааст";

            document.getElementById(
                "previewContainer"
            ).innerHTML = "";

            return;
        }


        /* NUMBER */

        if(files.length === 0){

            document.getElementById(
                "photoCount"
            ).innerText =
            "Акс интихоб нашудааст";

            return;
        }


        document.getElementById(
            "photoCount"
        ).innerText =
        "📷 " +
        files.length +
        " акс интихоб шуд";


        /* CLEAR PREVIEW */

        let container =
        document.getElementById(
            "previewContainer"
        );

        container.innerHTML = "";


        /* SHOW PHOTOS */

        for(
            let i = 0;
            i < files.length;
            i++
        ){

            let reader =
            new FileReader();


            reader.onload =
            function(e){

                let img =
                document.createElement(
                    "img"
                );

                img.src =
                e.target.result;

                img.className =
                "photo-preview";

                container.appendChild(
                    img
                );

            };


            reader.readAsDataURL(
                files[i]
            );

        }

    }
);


/* =================================
   PUBLISH AD
================================= */

function publishAd(){

    let category =
    document.getElementById(
        "category"
    ).value;


    let name =
    document.getElementById(
        "name"
    ).value.trim();


    let price =
    document.getElementById(
        "price"
    ).value.trim();


    let city =
    document.getElementById(
        "city"
    ).value.trim();


    let phone =
    document.getElementById(
        "phone"
    ).value.trim();


    let description =
    document.getElementById(
        "description"
    ).value.trim();


    let files =
    document.getElementById(
        "photos"
    ).files;


    /* CHECK */

    if(
        category === "" ||
        name === "" ||
        price === "" ||
        phone === "" ||
        files.length === 0
    ){

        alert(
            "⚠️ Категория, ном, нарх, рақам ва ақаллан 1 аксро пур кунед!"
        );

        return;
    }


    if(files.length > 10){

        alert(
            "⚠️ Максимум 10 акс!"
        );

        return;
    }


    /* READ ALL PHOTOS */

    let photos = [];

    let completed = 0;


    for(
        let i = 0;
        i < files.length;
        i++
    ){

        let reader =
        new FileReader();


        reader.onload =
        function(e){

            photos.push(
                e.target.result
            );

            completed++;


            if(
                completed ===
                files.length
            ){

                saveAd(
                    category,
                    name,
                    price,
                    city,
                    phone,
                    description,
                    photos
                );

            }

        };


        reader.readAsDataURL(
            files[i]
        );

    }

}


/* =================================
   SAVE
================================= */

function saveAd(
    category,
    name,
    price,
    city,
    phone,
    description,
    photos
){

    let ad = {

        id:Date.now(),

        category:category,

        name:name,

        price:price,

        city:city,

        phone:phone,

        description:description,

        images:photos,

        details:{}

    };


    /* CATEGORY DETAILS */

    let fields =
    document.querySelectorAll(
        "#categoryFields input, #categoryFields select, #categoryFields textarea"
    );


    fields.forEach(
        function(field){

            if(field.id){

                ad.details[
                    field.id
                ] =
                field.value;

            }

        }
    );


    /* OLD ADS */

    let ads =
    JSON.parse(
        localStorage.getItem(
            "markenAds"
        )
    ) || [];


    /* NEW AD */

    ads.unshift(ad);


    /* SAVE */

    localStorage.setItem(
        "markenAds",
        JSON.stringify(ads)
    );


    alert(
        "✅ Эълони шумо бомуваффақият нашр шуд!"
    );


    /* BACK TO HOME */

    window.location.href =
    "index.html";

}

</script>

</html>
