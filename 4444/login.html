<!DOCTYPE html>
<html lang="tg">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Вход - marken.tj</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* Қуттии Login */

.login-box{
    width:400px;
    background:white;
    padding:35px;
    border-radius:15px;

    box-shadow:0 5px 25px rgba(0,0,0,0.2);
}

/* Логотип */

.logo{
    text-align:center;
    font-size:38px;
    font-weight:bold;
    color:#078dcc;

    margin-bottom:10px;
}

/* Сарлавҳа */

h2{
    text-align:center;
    margin-bottom:25px;
}

/* Номҳои input */

label{
    display:block;
    margin-top:15px;
    margin-bottom:7px;

    font-weight:bold;
}

/* Input */

input{
    width:100%;
    padding:13px;

    border:1px solid #ccc;
    border-radius:8px;

    font-size:16px;
    outline:none;
}

input:focus{
    border:2px solid #078dcc;
}

/* Тугмаи Login */

.login-button{
    width:100%;

    margin-top:25px;
    padding:14px;

    border:none;
    border-radius:8px;

    background:#f0440b;
    color:white;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
}

.login-button:hover{
    background:#d93605;
}

/* Регистрация */

.register{
    text-align:center;
    margin-top:20px;
}

.register a{
    color:#078dcc;
    text-decoration:none;
    font-weight:bold;
}

/* Бозгашт */

.back{
    display:block;
    text-align:center;

    margin-top:20px;

    color:#777;
    text-decoration:none;
}

.message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

</style>

</head>


<body>


<div class="login-box">

    <div class="logo">
        marken.tj
    </div>

    <h2>
        Вход
    </h2>


    <form onsubmit="login(event)">

        <label>
            Рақами телефон
        </label>

        <input
            type="tel"
            id="phone"
            placeholder="+992 900000000"
            required
        >


        <label>
            Парол
        </label>

        <input
            type="password"
            id="password"
            placeholder="Паролро ворид кунед"
            required
        >


        <button
            type="submit"
            class="login-button"
        >
            Войти
        </button>

    </form>


    <div
        id="message"
        class="message"
    ></div>


    <div class="register">

        Аккаунт надоред?

        <a href="register.html">
            Регистрация
        </a>

    </div>


    <a
        href="index.html"
        class="back"
    >
        ← Бозгашт ба саҳифаи асосӣ
    </a>

</div>


<script>

function login(event){

    event.preventDefault();

    let phone =
        document.getElementById("phone").value;

    let password =
        document.getElementById("password").value;


    /*
       Маълумоти регистрацияшударо
       аз браузер мегирем
    */

    let savedUser =
        localStorage.getItem("markenUser");


    if(!savedUser){

        document.getElementById("message").innerHTML =
            "❌ Аввал регистрация кунед";

        return;
    }


    let user =
        JSON.parse(savedUser);


    /*
       Санҷиши телефон ва парол
    */

    if(
        phone === user.phone &&
        password === user.password
    ){

        document.getElementById("message").innerHTML =
            "✅ Воридшавӣ бомуваффақият!";


        setTimeout(function(){

            window.location.href =
                "index.html";

        },1000);

    }

    else{

        document.getElementById("message").innerHTML =
            "❌ Рақами телефон ё парол нодуруст аст";

    }

}

</script>


</body>

</html>
