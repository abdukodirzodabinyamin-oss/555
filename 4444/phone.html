<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Телефонҳо — marken.tj</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#fff;
    color:#222;
}

/* ===== HEADER ===== */

header{
    height:85px;
    background:#fff;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 50px;
}

.logo{
    font-size:38px;
    font-weight:bold;
    color:#078dcc;
}

.logo span{
    color:#f4a900;
}

.menu{
    display:flex;
    align-items:center;
    gap:30px;
}

.menu a{
    text-decoration:none;
    color:#078dcc;
    font-size:20px;
    cursor:pointer;
}

.add-btn{
    background:#f04b08;
    color:white !important;
    padding:14px 22px;
    border-radius:8px;
}

/* ===== BLUE AREA ===== */

.blue{
    background:#0799cc;
    padding:25px 50px 35px;
}

/* ===== SEARCH ===== */

.search-box{
    display:flex;
    max-width:850px;
    margin:auto;
}

.search-box input{
    flex:1;
    height:55px;
    border:none;
    padding:0 20px;
    font-size:20px;
    outline:none;
    border-radius:8px 0 0 8px;
}

.search-btn{
    width:150px;
    border:none;
    background:#ffc400;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    border-radius:0 8px 8px 0;
}

/* ===== BACK BUTTON ===== */

.back{
    display:inline-block;
    margin-bottom:20px;
    color:white;
    text-decoration:none;
    font-size:19px;
    background:#087db0;
    padding:10px 18px;
    border-radius:7px;
}

.back:hover{
    background:#05658e;
}

/* ===== TITLE ===== */

.title{
    max-width:1200px;
    margin:30px auto;
}

.title h1{
    font-size:38px;
}

.title p{
    color:#777;
    margin-top:10px;
    font-size:18px;
}

/* ===== ADD FORM ===== */

.form-box{
    max-width:1200px;
    margin:0 auto 40px;
    padding:25px;
    background:#f5f5f5;
    border-radius:12px;
}

.form-box h2{
    margin-bottom:20px;
}

.form-box input,
.form-box textarea,
.form-box select{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

.form-box textarea{
    height:110px;
    resize:none;
}

.form-box input[type="file"]{
    background:white;
}

.publish{
    background:#f04b08;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:7px;
    font-size:18px;
    cursor:pointer;
}

.publish:hover{
    background:#d83e00;
}

/* ===== ADS ===== */

.ads{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.card img{
    width:100%;
    height:210px;
    object-fit:cover;
    background:#eee;
}

.card-content{
    padding:18px;
}

.card h3{
    font-size:22px;
    margin-bottom:10px;
}

.price{
    color:#078dcc;
    font-size:20px;
    font-weight:bold;
    margin-bottom:8px;
}

.phone-number{
    color:#555;
    margin-bottom:8px;
}

.description{
    color:#666;
    line-height:1.5;
}

/* ===== EMPTY ===== */

.empty{
    text-align:center;
    color:#888;
    padding:50px;
    font-size:20px;
}

/* ===== MOBILE ===== */

@media(max-width:700px){

    header{
        padding:15px;
        height:auto;
        flex-direction:column;
        gap:15px;
    }

    .menu{
        flex-wrap:wrap;
        justify-content:center;
        gap:12px;
    }

    .blue{
        padding:20px 15px;
    }

    .title{
        padding:0 15px;
    }

    .form-box{
        margin:20px 15px;
    }

    .ads{
        margin:15px;
    }

}

</style>
</head>

<body>

<!-- ===== HEADER ===== -->

<header>

    <div class="logo">
        marken<span>.tj</span>
    </div>

    <div class="menu">

        <a href="#">Личный кабинет</a>

        <a href="login.html">
            Вход и регистрация
        </a>

        <a href="add.html" class="add-btn">
            Подать объявление
        </a>

    </div>

</header>


<!-- ===== BLUE SEARCH AREA ===== -->

<section class="blue">

    <a href="index.html" class="back">
        ← Бозгашт
    </a>

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Номи телефонро ҷустуҷӯ кунед..."
            oninput="searchPhones()"
        >

        <button class="search-btn">
            🔍 Ҷустуҷӯ
        </button>

    </div>

</section>


<!-- ===== TITLE ===== -->

<div class="title">

    <h1>📱 Телефонҳо</h1>

    <p>
        Телефонҳои барои фурӯш гузошташуда
    </p>

</div>


<!-- ===== ADD PHONE FORM ===== -->

<div class="form-box">

    <h2>📱 Телефони худро барои фурӯш гузоред</h2>

    <input
        type="text"
        id="phoneName"
        placeholder="Номи телефон (масалан: iPhone 15)"
    >

    <input
        type="number"
        id="phonePrice"
        placeholder="Нарх"
    >

    <input
        type="text"
        id="phoneNumber"
        placeholder="Рақами телефон"
    >

    <textarea
        id="phoneDescription"
        placeholder="Маълумоти телефон..."
    ></textarea>

    <label>
        📷 Суратҳои телефонро интихоб кунед:
    </label>

    <input
        type="file"
        id="phoneImages"
        accept="image/*"
        multiple
    >

    <button
        class="publish"
        onclick="addPhone()"
    >
        ➕ Эълон кардан
    </button>

</div>


<!-- ===== PHONE ADS ===== -->

<div class="ads" id="phoneList"></div>


<script>

/* =========================================
   Намоиши эълонҳои нигоҳдошташуда
========================================= */

let phones = JSON.parse(
    localStorage.getItem("phones")
) || [];


/* =========================================
   Намоиши телефонҳо
========================================= */

function showPhones(list = phones){

    const phoneList =
        document.getElementById("phoneList");

    phoneList.innerHTML = "";

    if(list.length === 0){

        phoneList.innerHTML = `
            <div class="empty">
                📱 Ҳоло ягон телефон нест.
            </div>
        `;

        return;
    }

    list.forEach(function(phone){

        let image = phone.images &&
                    phone.images.length > 0
                    ? phone.images[0]
                    : "";

        phoneList.innerHTML += `

            <div class="card">

                ${
                    image
                    ? `<img src="${image}">`
                    : `<div style="
                        height:210px;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        font-size:70px;
                        background:#eee;
                    ">📱</div>`
                }

                <div class="card-content">

                    <h3>
                        ${phone.name}
                    </h3>

                    <div class="price">
                        ${phone.price} сомонӣ
                    </div>

                    <div class="phone-number">
                        📞 ${phone.number}
                    </div>

                    <div class="description">
                        ${phone.description}
                    </div>

                </div>

            </div>

        `;

    });

}


/* =========================================
   Илова кардани телефон
========================================= */

function addPhone(){

    const name =
        document.getElementById("phoneName").value.trim();

    const price =
        document.getElementById("phonePrice").value.trim();

    const number =
        document.getElementById("phoneNumber").value.trim();

    const description =
        document.getElementById("phoneDescription").value.trim();

    const files =
        document.getElementById("phoneImages").files;


    /* Санҷиш */

    if(!name){

        alert("Номи телефонро нависед!");

        return;
    }

    if(!price){

        alert("Нархро нависед!");

        return;
    }

    if(!number){

        alert("Рақами телефонро нависед!");

        return;
    }


    /* Агар сурат интихоб нашуда бошад */

    if(files.length === 0){

        savePhone(
            name,
            price,
            number,
            description,
            []
        );

        return;
    }


    /* Хондани суратҳо */

    let images = [];

    let loaded = 0;


    for(let i = 0; i < files.length; i++){

        const reader = new FileReader();

        reader.onload = function(e){

            images.push(e.target.result);

            loaded++;

            if(loaded === files.length){

                savePhone(
                    name,
                    price,
                    number,
                    description,
                    images
                );

            }

        };

        reader.readAsDataURL(files[i]);

    }

}


/* =========================================
   Сабт кардани телефон
========================================= */

function savePhone(
    name,
    price,
    number,
    description,
    images
){

    const phone = {

        name:name,

        price:price,

        number:number,

        description:description,

        images:images

    };


    phones.push(phone);


    localStorage.setItem(
        "phones",
        JSON.stringify(phones)
    );


    /* Тоза кардани форма */

    document.getElementById("phoneName").value = "";

    document.getElementById("phonePrice").value = "";

    document.getElementById("phoneNumber").value = "";

    document.getElementById("phoneDescription").value = "";

    document.getElementById("phoneImages").value = "";


    /* Намоиш */

    showPhones();


    alert("✅ Эълон бомуваффақият гузошта шуд!");

}


/* =========================================
   Ҷустуҷӯи телефон
========================================= */

function searchPhones(){

    const text =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    const result = phones.filter(function(phone){

        return phone.name
            .toLowerCase()
            .includes(text);

    });

    showPhones(result);

}


/* =========================================
   Аввалин бор нишон додан
========================================= */

showPhones();

</script>

</body>
</html>
